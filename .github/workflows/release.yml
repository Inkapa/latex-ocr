name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  models:
    name: Export ONNX models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install pix2tex onnxscript onnx
          pip install --force-reinstall torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Export models
        run: python tools/export_onnx.py --output models

      - uses: actions/upload-artifact@v4
        with:
          name: onnx-models
          path: models
          retention-days: 1

  build:
    name: Build ${{ matrix.os }}
    needs: models
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: target/release/latex-ocr.exe
          - os: macos-latest
            exe: target/release/latex-ocr
          - os: ubuntu-latest
            exe: target/release/latex-ocr

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: onnx-models
          path: models

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libclang-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      - name: Assemble portable distribution
        run: python tools/make_dist.py --exe ${{ matrix.exe }} --models models --output dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/latex-ocr-*.zip
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
